name: Snap build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      build-from:
        description: Source to build
        type: choice
        options: [tag, head]
        default: tag
      channel:
        description: Store channel (leave empty to build only)
        type: string

jobs:
  snap:
    uses: sidalit/snap-automation/.github/workflows/snap-build.yaml@v1.0.4
    with:
      build-from: ${{ github.event_name == 'schedule' && 'head' || inputs.build-from || 'tag' }}
      channel: >-
        ${{ github.event_name == 'schedule' && 'edge'
            || github.event_name == 'push' && 'beta'
            || inputs.channel }}
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
