name: Snap build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      build-from:
        description: Source to build
        type: choice
        options: [tag, head]
        default: tag
      publish:
        description: Publish to the Snap Store
        type: boolean
        default: false

jobs:
  snap:
    uses: sidalit/snap-automation/.github/workflows/snap-build.yaml@v1.1.0
    with:
      build-from: ${{ github.event_name == 'schedule' && 'head' || inputs.build-from || 'tag' }}
      publish: ${{ github.event_name == 'push' || github.event_name == 'schedule' || inputs.publish == true }}
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
